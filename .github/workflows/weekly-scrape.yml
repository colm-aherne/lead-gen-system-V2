name: Weekly Cork lead collection and draft generation

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      draft_leads:
        description: "Generate drafts after collection"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: nationwide-ireland-lead-generation
  cancel-in-progress: false

jobs:
  collect-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect nationwide Ireland Google Maps leads
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/lead_gen_places.py

      - name: Draft eligible outreach emails
        if: github.event_name == 'schedule' || inputs.draft_leads == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/draft_leads.py
